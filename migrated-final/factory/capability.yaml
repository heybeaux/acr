activation:
  triggers:
    - type: pattern
      match: "factory"
    - type: pattern
      match: "/factory"
    - type: pattern
      match: "run the factory"
    - type: pattern
      match: "factory-ready"
    - type: pattern
      match: "pipeline status"
  trigger_logic: OR
  co_activates: []
  conflicts:
    - single manual code changes

