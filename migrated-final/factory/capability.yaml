name: factory
type: capability
version: 0.1.0
description: "Run the Factory 4.0 pipeline to process Linear tickets into PRs automatically. Use when: (1) user says /factory or asks to run the factory, (2) batch-processing tickets labeled factory-ready, (3)..."

provides:
  - factory
  - monitoring
  - background-jobs
  - realtime
  - access-control
  - ai-operations
  - version-control
  - batch-processing
  - factory-ready

requires:
  tools: []
    # TODO: Declare required MCP tools
  capabilities: []
  context: []

budget:
  index: 20
  summary: 154
  standard: 1462
