<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">

  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --green: #3fb950;
      --orange: #d29922;
      --code-bg: #1c2128;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    nav {
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
    }

    nav a:hover { color: var(--accent); }
    nav .logo { color: var(--text); font-weight: 700; font-size: 1.1rem; }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 1.5rem 0 0.5rem;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 2.5rem 0 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 1.5rem 0 0.75rem;
    }

    p { margin: 0.75rem 0; }

    a { color: var(--accent); }
    a:hover { color: var(--accent-hover); }

    strong { color: var(--text); }

    code {
      background: var(--code-bg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    }

    pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      margin: 1rem 0;
      line-height: 1.5;
    }

    pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.95em;
    }

    th, td {
      text-align: left;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-muted);
      margin: 1rem 0;
    }

    ul, ol {
      padding-left: 1.5rem;
      margin: 0.75rem 0;
    }

    li { margin: 0.3rem 0; }

    em { color: var(--text-muted); }

    .hero {
      text-align: center;
      padding: 2rem 0 1rem;
    }

    .hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0.5rem auto;
    }

    .badge {
      display: inline-block;
      padding: 0.2em 0.6em;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-green { background: rgba(63, 185, 80, 0.15); color: var(--green); }
    .badge-orange { background: rgba(210, 153, 34, 0.15); color: var(--orange); }
    .badge-blue { background: rgba(88, 166, 255, 0.15); color: var(--accent); }

    footer {
      margin-top: 4rem;
      padding: 2rem 0;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      h2 { font-size: 1.3rem; }
      .container { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <a href="{{ site.baseurl }}/" class="logo">ACR</a>
      <a href="{{ site.baseurl }}/">Home</a>
      <a href="https://github.com/heybeaux/acr/blob/main/specs/agent-capability-runtime.md">Spec</a>
      <a href="{{ site.baseurl }}/authoring-guide">Authoring Guide</a>
      <a href="{{ site.baseurl }}/mcp-positioning">ACR + MCP</a>
      <a href="https://github.com/heybeaux/acr">GitHub</a>
    </nav>

    {{ content }}

    <footer>
      ACR is an open specification — MIT licensed — <a href="https://github.com/heybeaux/acr">heybeaux/acr</a>
    </footer>
  </div>
</body>
</html>
